<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="#334155" stroke-width="6" />

  <!-- Subtle inner neon ring -->
  <rect x="36" y="36" width="440" height="440" rx="92" fill="none" stroke="url(#glowGrad)" stroke-width="3" />

  <!-- Glowing background effect behind the logo -->
  <circle cx="256" cy="256" r="140" fill="#6366f1" opacity="0.15" filter="url(#glow)" />

  <!-- Center Icon: Dynamic Interlocking Keys forming X -->
  <g filter="url(#glow)">
    <!-- Diagonal stroke 1: Top-Left to Bottom-Right -->
    <path d="M140 140 L372 372" stroke="url(#accentGrad)" stroke-width="44" stroke-linecap="round" />
    <!-- Diagonal stroke 2: Top-Right to Bottom-Left -->
    <path d="M372 140 L140 372" stroke="url(#accentGrad)" stroke-width="44" stroke-linecap="round" />
    <!-- Center keycap node -->
    <rect x="216" y="216" width="80" height="80" rx="20" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="8" />
    <circle cx="256" cy="256" r="14" fill="#38bdf8" />
  </g>
</svg>
