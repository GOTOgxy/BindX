name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Tauri Application
        run: npx tauri build --no-bundle

      - name: Locate and Package Artifacts
        shell: pwsh
        run: |
          # 1. Locate bindx.exe wherever it was generated
          $exe = Get-ChildItem -Path . -Recurse -Filter "bindx.exe" | Where-Object { $_.FullName -like "*release*bindx.exe" } | Select-Object -First 1
          if (-not $exe) {
              $exe = Get-ChildItem -Path "C:\Users" -Recurse -Filter "bindx.exe" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like "*release*bindx.exe" } | Select-Object -First 1
          }
          if (-not $exe) {
              throw "Could not locate release bindx.exe"
          }
          Write-Host "Found bindx.exe at: $($exe.FullName)"
          Copy-Item $exe.FullName -Destination "bindx.exe" -Force

          # 2. Portable zip: the single executable and nothing else
          New-Item -ItemType Directory -Path "bindx-portable" -Force
          Copy-Item "bindx.exe" -Destination "bindx-portable\bindx.exe" -Force
          Compress-Archive -Path "bindx-portable\*" -DestinationPath "bindx-windows-x64-portable.zip" -Force
          Write-Host "Created bindx-windows-x64-portable.zip (exe only)"

          # 3. Installer: compile the Inno Setup script into bindx-setup.exe
          $version = (Get-Content "src-tauri\tauri.conf.json" -Raw | ConvertFrom-Json).version
          Copy-Item "bindx.exe" -Destination "installer\bindx.exe" -Force
          $iscc = $null
          foreach ($candidate in @(
              (Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"),
              (Join-Path ${env:ProgramFiles} "Inno Setup 6\ISCC.exe"),
              (Join-Path ${env:ProgramFiles(x86)} "Inno Setup 5\ISCC.exe")
          )) {
              if (Test-Path $candidate) { $iscc = $candidate; break }
          }
          if (-not $iscc) { $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source }
          if (-not $iscc) { throw "ISCC.exe not found on runner" }
          Write-Host "Using ISCC: $iscc"
          $zhArgs = @()
          $zhIsl = Join-Path (Split-Path $iscc -Parent) "Languages\ChineseSimplified.isl"
          if (-not (Test-Path $zhIsl)) { $zhArgs = @("/DNO_ZH"); Write-Host "ChineseSimplified.isl absent, compiling with English only" }
          $isccOut = & $iscc @zhArgs /DMyAppVersion=$version "installer\bindx.iss" 2>&1 | Out-String
          Write-Host $isccOut
          if ($LASTEXITCODE -ne 0) {
              Set-Content -Path "iscc-failure.log" -Value $isccOut
              throw "ISCC failed with exit code $LASTEXITCODE (see iscc-failure.log artifact)"
          }
          Move-Item "installer\Output\bindx-setup.exe" -Destination "bindx-setup.exe" -Force
          Write-Host "Created bindx-setup.exe"

      - name: Upload ISCC failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: iscc-failure-log
          path: iscc-failure.log
          if-no-files-found: ignore

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bindx.exe
            bindx-windows-x64-portable.zip
            bindx-setup.exe
          tag_name: ${{ github.ref_name }}
          name: BindX ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
